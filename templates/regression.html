<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регрессия: Предсказание массы тела</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 540px; margin: 40px auto; padding: 0 16px; line-height: 1.5; }
        nav { margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid #ddd; }
        nav a { margin-right: 16px; font-weight: bold; text-decoration: none; color: #0066cc; }
        nav a.active { color: #111; border-bottom: 2px solid #111; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-weight: 500; margin-bottom: 4px; }
        input[type="number"] { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { margin-top: 10px; width: 100%; padding: 10px; background-color: #28a745; color: #fff; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #218838; }
        .result-box { margin-top: 24px; padding: 16px; background-color: #f2faf4; border-left: 5px solid #28a745; border-radius: 4px; }
    </style>
</head>
<body>

    <nav>
        <a href="/classification">Классификация</a>
        <a href="/regression" class="active">Регрессия</a>
    </nav>

    <h2>Регрессия: Масса пингвина</h2>
    <p>Введите измерения клюва и крыла для предсказания веса:</p>

    <form method="post" action="/regression">
        <div class="form-group">
            <label for="bill_length">Длина клюва (мм):</label>
            <input type="number" step="0.1" id="bill_length" name="bill_length" value="{{ values.bill_length if values else '46.1' }}" required>
        </div>

        <div class="form-group">
            <label for="bill_depth">Глубина клюва (мм):</label>
            <input type="number" step="0.1" id="bill_depth" name="bill_depth" value="{{ values.bill_depth if values else '13.2' }}" required>
        </div>

        <div class="form-group">
            <label for="flipper_length">Длина крыла (мм):</label>
            <input type="number" step="0.1" id="flipper_length" name="flipper_length" value="{{ values.flipper_length if values else '211.0' }}" required>
        </div>

        <button type="submit">Рассчитать массу</button>
    </form>

    {% if prediction is not none %}
    <div class="result-box">
        <h3>Результат:</h3>
        <p>Предсказанная масса тела: <strong>{{ prediction }} {{ unit }}</strong></p>
    </div>
    {% endif %}

</body>
</html>
